name: Project page

# Publishes site/ to GitHub Pages: the download page (its button follows version_number.txt; its sound is the HQ
# Amb_Waves) and the sound list (sounds/), with the game's own sound files it lists (copied as they are, by their
# paths in site/sounds/sounds.json).
# Repository Settings > Pages > Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "version_number.txt", "game/audio/hq/Amb_Waves.wav", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the pages and the sounds
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp version_number.txt _site/
          # (The download page's waves, played when its sound is turned on.)
          mkdir -p _site/game/audio/hq
          cp game/audio/hq/Amb_Waves.wav _site/game/audio/hq/
          python3 - <<'EOF'
          import json, os, shutil
          for s in json.load(open('site/sounds/sounds.json', encoding='utf-8'))['sounds']:
              dst = os.path.join('_site', s['file'])
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copyfile(s['file'], dst)
          EOF
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
