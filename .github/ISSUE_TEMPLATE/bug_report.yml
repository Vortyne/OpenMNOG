name: Bug report
description: Something in the game doesn't work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: The music stopped when I walked into the mine...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game?
      placeholder: Onu-Koro, near the lava; or the Episode 9-1 cutscene
    validations:
      required: true
