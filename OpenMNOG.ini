; OpenMNOG settings (the game's own settings are in its Settings menu).

[Save]
; The folder for your save, slot pictures and save backups. Leave it empty for the default:
;   Windows: Documents\My Games\OpenMNOG
; A path can use environment variables (%USERPROFILE%\Saves\OpenMNOG). A relative one is from this file's folder,
; e.g. "Folder=saves" keeps everything beside the game (to carry it on a USB stick).
Folder=

[Display]
; If the screen goes black for a second or two when the game goes fullscreen or back to a window, set this to 1:
; fullscreen is then a window one pixel taller than the screen, which graphics drivers don't switch the screen over to.
TallerFullscreen=0
