[Save]
; The folder for your save, slot pictures and save backups. Leave it empty for the default:
;   Windows: Documents\My Games\OpenMNOG
; A path can use environment variables (%USERPROFILE%\Saves\OpenMNOG). A relative one is from this file's folder,
; e.g. "Folder=saves" keeps everything beside the game (to carry it on a USB stick).
